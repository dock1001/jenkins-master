jenkins:
  # Builds run on agents, not the controller
  numExecutors: 0

# No credentials here on purpose. JCasC replaces the whole credential store with
# what it is given, so declaring any credential in the image would delete every
# credential added in the UI on each restart. Credentials are opt-in: mount a
# folder with your own JCasC files at /var/jenkins_casc (see README).
